document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('enter'),input=document.getElementById('password'),error=document.getElementById('error');button.disabled=true;error.textContent='잠금을 해제하고 있습니다…';try{if(!crypto.subtle)throw Error('unsupported');const material=await crypto.subtle.importKey('raw',enc.encode(input.value),'PBKDF2',false,['deriveKey']);sessionKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);const html=await decrypt(payload);input.value='';frame=document.createElement('iframe');frame.title='TSD 장비 연결 연구실';frame.setAttribute('sandbox','allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox');frame.srcdoc=html;document.getElementById('gate').hidden=true;document.getElementById('gate').style.display='none';document.body.append(frame);}catch(ex){sessionKey=null;error.textContent=ex.message==='unsupported'?'HTTPS 주소 또는 localhost에서 열어주세요.':'비밀번호가 올바르지 않거나 암호화 파일이 손상되었습니다.';}finally{button.disabled=false;}};
window.addEventListener('message',async e=>{if(!frame||e.source!==frame.contentWindow)return;const data=e.data;if(data.type==='tsd-lock'){sessionKey=null;location.reload();return;}if(data.type==='tsd-ready'){try{const saved=localStorage.getItem('tsd-equipment-encrypted-v1');if(saved)frame.contentWindow.postMessage({type:'tsd-load',config:JSON.parse(await decrypt(JSON.parse(saved)))},'*');}catch{}return;}if(data.type==='tsd-save'&&sessionKey){try{const iv=crypto.getRandomValues(new Uint8Array(12));const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},sessionKey,enc.encode(JSON.stringify(data.config)));localStorage.setItem('tsd-equipment-encrypted-v1',JSON.stringify({iv:b64(iv),data:b64(encrypted)}));frame.contentWindow.postMessage({type:'tsd-saved',ok:true},'*');}catch{frame.contentWindow.postMessage({type:'tsd-saved',ok:false},'*');}}});
