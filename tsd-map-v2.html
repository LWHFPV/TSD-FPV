<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map Test</title>
    <style>
        /* Make the map fill the screen */
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <h2>Google Map Test</h2>
    <div id="map"></div>

    <!-- Google Maps API script -->
    <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
    </script>

    <script>
        // Initialize and add the map
        function initMap() {
            try {
                // Example coordinates: Seoul, South Korea
                const location = { lat: 37.5665, lng: 126.9780 };

                // Create the map centered at location
                const map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 12,
                    center: location
                });

                // Add a marker at the location
                new google.maps.Marker({
                    position: location,
                    map: map,
                    title: "Seoul City Hall"
                });
            } catch (error) {
                console.error("Error initializing map:", error);
                alert("Failed to load the map. Please check your API key and internet connection.");
            }
        }
    </script>
</body>
</html>
