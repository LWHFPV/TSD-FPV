
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSD P0 | VWorld 3D FIX v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#091722;color:#eef6ff;font:14px/1.5 system-ui,sans-serif}
header{padding:12px 16px;background:#102435}
h1{font-size:16px;margin:0 0 5px}
small{color:#b5c7d7}
input,button{padding:9px;margin:4px 2px;font:inherit;border-radius:5px}
input{width:min(95%,400px);background:#fff;border:0}
button{cursor:pointer;border:1px solid #52718a;background:#183b54;color:white}
button:disabled{opacity:.4}
#map{height:65vh;min-height:350px;background:#263b49}
#status{padding:10px 16px;background:#0d2232}
#log{margin:0;padding:12px 16px;white-space:pre-wrap;max-height:220px;overflow:auto;color:#b9d6e9;font-size:12px}
.note{padding:10px 16px;color:#b5c7d7}
</style>
</head>
<body>
<header>
<h1>TSD P0 · 브이월드 실제 3D 지형 FIX v3</h1>
<small>북한산 백운대 37.6587, 126.9770 · WebGL 3.0 · 가상 지형 없음</small>
<div>
<input id="key" type="password" placeholder="브이월드 API 인증키" autocomplete="off">
<button id="start">3D 지도 연결</button>
<button id="oblique" disabled>경사 -65°</button>
<button id="nadir" disabled>직하방 -90°</button>
<button id="copy">진단 기록 복사</button>
</div>
</header>

<div id="map"></div>
<div id="status">인증키 입력 후 3D 지도 연결을 누르세요.</div>
<pre id="log"></pre>
<div class="note">
실제 3D 지형 표시는 브이월드 API의 정상 실행과 데이터 제공 상태에 따릅니다.
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const logs = [];

let map = null;
let viewer = null;
let started = false;
let initialized = false;
let timer = null;
let apiErrors = [];

function report(message) {
  const time = new Date().toLocaleTimeString('ko-KR');
  logs.push('[' + time + '] ' + message);
  $('log').textContent = logs.join('\n');
  $('status').textContent = message;
}

function sanitize(message) {
  const key = $('key').value.trim();
  let result = String(message || '알 수 없는 오류');
  if (key) result = result.split(key).join('[인증키 숨김]');
  return result.slice(0, 800);
}

window.addEventListener('error', event => {
  if (!started) return;
  const message = sanitize(event.message || '리소스 로드 오류');
  apiErrors.push(message);
  report('JavaScript 오류: ' + message);
});

window.addEventListener('unhandledrejection', event => {
  if (!started) return;
  const message = sanitize(event.reason?.message || event.reason);
  apiErrors.push(message);
  report('비동기 오류: ' + message);
});

function updateViewer() {
  viewer = window.ws3d?.viewer || null;
  const enabled = !!viewer && !!window.Cesium;
  $('oblique').disabled = !enabled;
  $('nadir').disabled = !enabled;
  return enabled;
}

function moveCamera(pitch) {
  if (!updateViewer()) {
    report('카메라 조작 불가: 3D 엔진 미준비');
    return;
  }

  try {
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(
        126.9770, 37.6587, 3500
      ),
      orientation: {
        heading: 0,
        pitch: Cesium.Math.toRadians(pitch),
        roll: 0
      }
    });
    report('카메라 시점 ' + pitch + '° 적용');
  } catch (error) {
    report('카메라 오류: ' + sanitize(error.message));
  }
}

$('oblique').onclick = () => moveCamera(-65);
$('nadir').onclick = () => moveCamera(-90);

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(logs.join('\n'));
    report('진단 기록 복사 완료');
  } catch (error) {
    report('클립보드 복사 실패');
  }
};

function initializeMap() {
  if (!window.vw || typeof window.vw.Map !== 'function') {
    report(
      'API 객체 미생성: vw.Map 없음 · ' +
      'JavaScript 오류 수=' + apiErrors.length
    );
    return;
  }

  if (
    typeof vw.CameraPosition !== 'function' ||
    typeof vw.CoordZ !== 'function' ||
    typeof vw.Direction !== 'function'
  ) {
    report('API 일부만 생성됨: 카메라 생성자 확인 필요');
    return;
  }

  try {
    report('3/4 API 객체 확인 · 지도 초기화 시작');

    vw.ws3dInitCallBack = function () {
      initialized = true;
      clearTimeout(timer);

      const ready = updateViewer();

      report(
        '4/4 초기화 콜백 수신 · ' +
        'viewer=' + ready
      );
    };

    const options = {
      mapId: 'map',
      initPosition: new vw.CameraPosition(
        new vw.CoordZ(126.9770, 37.6587, 3500),
        new vw.Direction(0, -65, 0)
      ),
      logo: true,
      navigation: true
    };

    map = new vw.Map();
    map.setOption(options);
    map.start();

    report('3/4 map.start() 실행 · 지형 로딩 대기');

    timer = setTimeout(() => {
      if (!initialized) {
        report(
          '초기화 시간 초과 · viewer=' +
          updateViewer() +
          ' · JavaScript 오류 수=' + apiErrors.length
        );
      }
    }, 20000);

  } catch (error) {
    report('지도 생성 오류: ' + sanitize(error.stack || error.message));
  }
}

$('start').onclick = () => {
  if (started) return;

  const key = $('key').value.trim();
  if (!key) {
    report('API 인증키를 입력하세요.');
    return;
  }

  started = true;
  $('start').disabled = true;
  apiErrors = [];

  report('1/4 브이월드 WebGL 3.0 스크립트 요청');

  const script = document.createElement('script');

  script.src =
    'https://map.vworld.kr/js/webglMapInit.js.do' +
    '?version=3.0&apiKey=' + encodeURIComponent(key);

  script.onerror = () => {
    report('API 스크립트 네트워크 로드 실패');
    started = false;
    $('start').disabled = false;
  };

  script.onload = () => {
    report(
      '2/4 스크립트 로드 완료 · ' +
      'vw=' + Boolean(window.vw) +
      ' · Map=' + Boolean(window.vw?.Map)
    );

    if (window.vw?.Map) {
      initializeMap();
      return;
    }

    setTimeout(() => {
      report(
        'API 재확인 · vw=' + Boolean(window.vw) +
        ' · Map=' + Boolean(window.vw?.Map) +
        ' · 오류 수=' + apiErrors.length
      );

      if (window.vw?.Map) {
        initializeMap();
      } else {
        report(
          '연결 실패: API 스크립트 응답 후에도 vw.Map 없음. ' +
          'Console 오류 및 API 응답 실행 결과 확인 필요.'
        );
      }
    }, 1500);
  };

  document.head.appendChild(script);
};
</script>
</body>
</html>
