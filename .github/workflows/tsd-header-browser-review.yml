name: TSD header browser review
on:
  push:
    branches: [review/tsd-header-browser-check-20261126]
  pull_request:
    branches: [review/tsd-aero-header-main-safe-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/tsd-aero-header-main-safe-20261126
          fetch-depth: 1
          lfs: false
      - name: Fetch baseline main for source comparison
        run: git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1 axe-core@4.10.3 pngjs@7.0.0
      - name: Export existing encrypted equipment page for private browser verification
        uses: actions/upload-artifact@v4
        with:
          name: tsd-equipment-encrypted-candidate
          path: |
            equipment-lab.html
            tsd-aero-common.css
          retention-days: 3
      - name: Install Chromium and system dependencies
        shell: bash
        run: |
          if ! npx playwright install --with-deps chromium; then
            # The Ubuntu runner's unrelated Microsoft apt repository can return 403.
            # Remove only its source for this disposable runner, never application code.
            sudo grep -rl 'packages.microsoft.com/ubuntu/24.04/prod' /etc/apt/sources.list.d/ | while IFS= read -r file; do
              if sudo grep -Eqv '^(#.*|[[:space:]]*|.*packages.microsoft.com/ubuntu/24.04/prod.*|Types:.*|Suites:.*|Components:.*|Signed-By:.*|Architectures:.*)$' "$file"; then
                echo "Unexpected mixed apt source; not modifying $file"; exit 1
              fi
              sudo mv "$file" "$file.disabled"
            done
            npx playwright install --with-deps chromium
          fi
      - name: Run desktop and mobile header smoke checks
        env:
          TSD_EQUIPMENT_QA_PASSWORD: ${{ secrets.TSD_EQUIPMENT_QA_PASSWORD }}
        shell: bash
        run: |
          mkdir -p /tmp/tsd-header-results
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tsd-header-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import { PNG } from 'pngjs';
          import { execFileSync } from 'node:child_process';
          const checkedCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const axeSource=fs.readFileSync('node_modules/axe-core/axe.min.js','utf8');
          const paths=['TSD_EOIR_V24_Mission.html','blackbox-analyzer.html','contact.html','drone-design.html','education.html','equipment-lab.html','flight-safety.html','fpv-flight-lab.html','link-budget.html','long-range-calculator.html','simulator.html','tsd-qgc-mission-lab.html','prop-vibration-lab.html'];
          const result=[];
