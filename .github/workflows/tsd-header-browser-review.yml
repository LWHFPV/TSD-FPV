name: TSD header browser review
on:
  push:
    branches: [review/tsd-header-browser-check-20261126]
  pull_request:
    branches: [review/tsd-aero-header-main-safe-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/tsd-aero-header-main-safe-20261126
          fetch-depth: 1
          lfs: false
      - name: Fetch baseline main for source comparison
        run: git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1 axe-core@4.10.3 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile header smoke checks
        shell: bash
        run: |
          mkdir -p /tmp/tsd-header-results
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tsd-header-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import { PNG } from 'pngjs';
          import { execFileSync } from 'node:child_process';
          const checkedCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const axeSource=fs.readFileSync('node_modules/axe-core/axe.min.js','utf8');
          const paths=['TSD_EOIR_V24_Mission.html','blackbox-analyzer.html','contact.html','drone-design.html','education.html','equipment-lab.html','flight-safety.html','fpv-flight-lab.html','link-budget.html','long-range-calculator.html','simulator.html','tsd-qgc-mission-lab.html','prop-vibration-lab.html'];
          const result=[];
          const baseCommit=execFileSync('git',['rev-parse','refs/remotes/origin/main'],{encoding:'utf8'}).trim();
          const sourceAudit=paths.filter(f=>f!=='prop-vibration-lab.html').map(file=>{
            const baseline=execFileSync('git',['show',baseCommit+':'+file],{encoding:'utf8',maxBuffer:100*1024*1024});
            const candidate=fs.readFileSync(file,'utf8');
            const scripts=s=>[...s.matchAll(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi)].map(m=>m[0].replace(/\r\n/g,'\n'));
            const before=scripts(baseline),after=scripts(candidate);
            const differences=before.map((x,i)=>{
              const y=after[i]??'';if(x===y)return null;
              let p=0;while(p<Math.min(x.length,y.length)&&x[p]===y[p])p++;
              let q=0;while(q<Math.min(x.length,y.length)-p&&x[x.length-1-q]===y[y.length-1-q])q++;
              return {index:i,beforeLength:x.length,afterLength:y.length,firstDifference:p,before:x.slice(Math.max(0,p-100),Math.min(x.length-q+100,p+700)),after:y.slice(Math.max(0,p-100),Math.min(y.length-q+100,p+700))};
            }).filter(Boolean);
            return {file,baselineScripts:before.length,candidateScripts:after.length,scriptsIdentical:JSON.stringify(before)===JSON.stringify(after),differences};
          });
          fs.writeFileSync('/tmp/tsd-header-results/source-audit.json',JSON.stringify({baseCommit,checkedCommit,sourceAudit},null,2));
          console.log(JSON.stringify({baseCommit,checkedCommit,sourceAudit}));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          async function fingerprint(header,home=false){
            return header.evaluate((h,home)=>{
              const get=(q)=>h.querySelector(q);
              const bar=get(home?'.tsd-bar':'[data-tsd-common-bar]');
              const brand=get(home?'.tsd-brand':'[data-tsd-common-brand]');
              const mark=brand?.querySelector('span');
              const nav=get(home?'nav':'[data-tsd-common-nav]');
              const contact=get(home?'.tsd-contact':'[data-tsd-common-contact]');
              const rect=h.getBoundingClientRect();
              const pick=(el,props)=>{if(!el)return null;const s=getComputedStyle(el);const r=el.getBoundingClientRect();return {rect:[r.x-rect.x,r.y-rect.y,r.width,r.height].map(x=>Math.round(x*100)/100),css:Object.fromEntries(props.map(p=>[p,s[p]]))};};
              const links=[...h.querySelectorAll('a')].map(a=>({label:a.textContent.replace(/\s+/g,' ').trim(),url:new URL(a.href).pathname.split('/').pop(),hash:new URL(a.href).hash}));
              return {header:pick(h,['backgroundColor','borderBottomColor','borderBottomWidth']),bar:pick(bar,['display','gridTemplateColumns','gap','minHeight']),brand:pick(brand,['fontFamily','fontSize','fontWeight','color','gap']),mark:pick(mark,['backgroundColor','color','borderRadius','fontSize']),nav:pick(nav,['display','justifyContent','gap','flexWrap']),menu:pick(nav?.querySelector('a'),['fontFamily','fontSize','fontWeight','color','minHeight']),contact:pick(contact,['fontFamily','fontSize','fontWeight','color','borderColor','borderRadius','minHeight']),links,hero:(()=>{const e=document.querySelector(home?'#tsd-fpv-preview .tsd-hero':'[data-tsd-common-hero]');if(!e)return null;const s=getComputedStyle(e);return {background:s.backgroundImage,color:s.color,pattern:getComputedStyle(e,'::before').backgroundImage};})()};
            },home);
          }
          const baselines={};
          for(const width of [1440,768,390,320]){
            const ctx=await browser.newContext({viewport:{width,height:900}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
            const header=page.locator('#tsd-fpv-preview header').first();
            await header.waitFor({state:'visible'});
            baselines[width]=await fingerprint(header,true);
            await header.screenshot({path:'/tmp/tsd-header-results/home-header-'+width+'.png',timeout:30000});
            await ctx.close();
          }
          function compare(base,actual){
            const out=[];
            for(const name of ['header','bar','brand','mark','nav','menu','contact']){
              if(!base[name]||!actual[name]){out.push({name,missing:true});continue;}
              for(const [prop,val] of Object.entries(base[name].css)){
                if(val!==actual[name].css[prop])out.push({name,prop,expected:val,actual:actual[name].css[prop]});
              }
              const delta=actual[name].rect.map((v,i)=>Math.round((v-base[name].rect[i])*100)/100);
              if(delta.some(v=>Math.abs(v)>3))out.push({name,geometryDeltaPx:delta});
            }
            return out;
          }
          for (const file of paths) for (const width of [1440,768,390,320]) {
            const context=await browser.newContext({viewport:{width,height:900}});
            const page=await context.newPage(); const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const entry={file,width,errors};
            try {
              const response=await page.goto('http://127.0.0.1:8765/'+file,{waitUntil:'domcontentloaded',timeout:30000});
              entry.http=response?.status();
              const header=page.locator('[data-tsd-common-header]:visible').first();
              if(file==='tsd-qgc-mission-lab.html'){
                await page.waitForLoadState('load',{timeout:30000}).catch(()=>{});
                entry.qgcInitial=await page.evaluate(()=>({ready:document.readyState,course:document.getElementById('courseHome')?.className,openCourseType:typeof openCourse,buttons:[...document.querySelectorAll('button')].filter(b=>b.getBoundingClientRect().width>0).map(b=>({id:b.id,text:b.textContent.trim().slice(0,70),handler:b.getAttribute('onclick')})).slice(0,80)}));
                if(!await header.count()){
                  const menu=page.locator('#menuButton:visible');
                  if(await menu.count()){
                    await menu.click({timeout:5000});
                    entry.qgcMenu=await page.evaluate(()=>[...document.querySelectorAll('button,a,[role=menuitem]')].filter(b=>b.getBoundingClientRect().width>0&&b.getBoundingClientRect().height>0&&getComputedStyle(b).visibility!=='hidden').map(b=>({id:b.id,text:b.textContent.trim().slice(0,100)})).slice(0,120));
                  }
                  const courseButton=page.locator('button:visible,a:visible,[role=menuitem]:visible').filter({hasText:/^(교육 과정|교육과정|교육 홈|실습 과정|실습과정|실습 홈|교육 시작|단계별 실습|튜토리얼|처음부터 배우기|학습 과정|교육 목록|실습 목록|교육 과정으로|교육 과정으로 돌아가기|교육 과정 홈|교육 홈으로|교육 과정 보기|교육 과정 열기|교육 안내|교육 메뉴|교육·실습|실습 안내|실습 메뉴|과정 선택|교육 과정 선택|학습 홈|교육과정 선택)$/}).first();
                  if(await courseButton.count()){
                    entry.courseEntry='visible UI button';
                    await courseButton.click({timeout:5000}).catch(e=>entry.courseClickError=String(e));
                  }
                  if(!await header.count()){
                    entry.courseEntry='direct diagnostic only';
                    entry.courseOpened=await page.evaluate(()=>{if(typeof openCourse!=='function')return false;openCourse();return true;});
                  }
                }else entry.courseEntry='initial';
              }
              await header.waitFor({state:'visible',timeout:10000});
              const nav=await header.evaluate(h=>{
                const r=h.getBoundingClientRect();
                const links=[...h.querySelectorAll('a')].map(a=>{const b=a.getBoundingClientRect(); return {label:a.textContent.trim(),href:a.getAttribute('href'),visible:b.width>0&&b.height>0,left:b.left,right:b.right};});
                return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,viewport:innerWidth,viewportHeight:innerHeight,links,overflow:h.scrollWidth>h.clientWidth+1};
              });
              Object.assign(entry,nav);
              entry.pass=entry.http===200&&!entry.overflow&&nav.left>=-1&&nav.right<=width+1&&nav.links.length>=6&&nav.links.every(a=>a.visible&&a.left>=-1&&a.right<=width+1)&&errors.length===0&&entry.courseEntry!=='direct diagnostic only';
              entry.fingerprint=await fingerprint(header);
              entry.styleSheets=await page.evaluate(()=>[...document.styleSheets].map(s=>({href:s.href,inlineCommon:!!s.ownerNode?.hasAttribute('data-tsd-common-inline')})));
              entry.cssSource=await page.evaluate(()=>[...document.querySelectorAll('link[rel=stylesheet]')].filter(l=>l.href.includes('tsd-aero-common.css')).map(l=>({href:l.href,loaded:!!l.sheet})));
              entry.commonCssResponse=await page.request.get('http://127.0.0.1:8765/tsd-aero-common.css').then(async res=>({status:res.status(),length:(await res.body()).length}));
              entry.visualDifferences=compare(baselines[width],entry.fingerprint);
              entry.heroBackgroundMatch=entry.fingerprint.hero?.background===baselines[width].hero?.background;
              entry.heroPatternMatch=entry.fingerprint.hero?.pattern===baselines[width].hero?.pattern;
              entry.menuLabelsMatch=entry.fingerprint.links.map(x=>x.label.replace(/\s/g,'')).join('|')===baselines[width].links.map(x=>x.label.replace(/\s/g,'')).join('|');
              entry.menuTargetsMatch=entry.fingerprint.links.map(x=>x.url).join('|')===baselines[width].links.map(x=>x.url).join('|');
              entry.linkChecks=[];
              for(const link of await header.locator('a').all()){
                const href=await link.evaluate(a=>a.href);
                const url=new URL(href);
                const filePath=url.pathname.split('/').pop()||'index.html';
                const local='http://127.0.0.1:8765/'+filePath;
                const response=await page.request.get(local,{timeout:10000});
                entry.linkChecks.push({file:filePath,status:response.status(),hash:url.hash});
              }
              await page.addScriptTag({content:axeSource});
              entry.axe=await header.evaluate(async h=>{const result=await window.axe.run(h,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']}});return result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}));},undefined,{timeout:90000});
              // Capture the rendered viewport once, without waiting for another layout action.
              // The header crop is derived from real PNG pixels, not reconstructed markup.
              let pixels;
              let session;
              try {
                session=await context.newCDPSession(page);
                let timer;
                try {
                  const capture=await Promise.race([session.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('CDP screenshot timeout')),45000);})]);
                  pixels=Buffer.from(capture.data,'base64');
                } finally {clearTimeout(timer);}
                entry.captureMethod='chromium-cdp';
              } catch(e) {
                entry.captureFallback=String(e);
                pixels=await page.screenshot({timeout:45000,animations:'disabled'});
                entry.captureMethod='playwright';
              } finally {if(session)await session.detach().catch(()=>{});}
              const full=PNG.sync.read(pixels);
              const sx=full.width/nav.viewport,sy=full.height/nav.viewportHeight;
              const x=Math.max(0,Math.floor(nav.left*sx)),y=Math.max(0,Math.floor(nav.top*sy));
              const right=Math.min(full.width,Math.ceil(nav.right*sx)),bottom=Math.min(full.height,Math.ceil(nav.bottom*sy));
              if(right<=x||bottom<=y)throw Error('Header outside captured viewport');
              const cropped=new PNG({width:right-x,height:bottom-y});
              PNG.bitblt(full,cropped,x,y,cropped.width,cropped.height,0,0);
              fs.writeFileSync('/tmp/tsd-header-results/'+file+'-'+width+'.png',pixels);
              fs.writeFileSync('/tmp/tsd-header-results/header-'+file+'-'+width+'.png',PNG.sync.write(cropped));
              entry.headerCapture=true;
              entry.captureSize=[full.width,full.height];
              if(file==='prop-vibration-lab.html'){
                const checks={};
                const ensure=(key,value)=>{checks[key]=!!value;if(!value)throw Error('PropLab functional failure: '+key);};
                entry.propChecks=checks;
                await page.locator('#motors button').first().waitFor({state:'visible',timeout:10000});
                ensure('fourMotors',await page.locator('#motors button').count()===4);
                ensure('canvases',await page.evaluate(()=>['airframe3d','drone','track','spectrum'].every(id=>{const c=document.getElementById(id);return c instanceof HTMLCanvasElement&&c.width>0&&c.height>0&&c.getBoundingClientRect().width>0;})));
                const rpmBefore=await page.locator('#rpm').innerText();
                await page.locator('#throttle').fill('60');
                await page.waitForFunction(old=>document.querySelector('#power').textContent.includes('60')&&document.querySelector('#rpm').textContent!==old,rpmBefore,{timeout:15000});
                ensure('throttleRPM',true);
                for(const [id,v] of [['roll','35'],['pitch','-25'],['yaw','40']]){
                  await page.locator('#'+id).fill(v);
                  ensure(id,await page.locator('#'+id).inputValue()===v&&await page.locator('#'+id+'Value').innerText().then(t=>t.includes(v.replace('-',''))));
                }
                await page.locator('#axesCenter').click();
                ensure('axesCenter',await page.evaluate(()=>['roll','pitch','yaw'].every(id=>document.getElementById(id).value==='0')));
                await page.locator('#motors button').nth(2).click();
                ensure('motorSelect',await page.locator('#motors button').nth(2).getAttribute('aria-pressed')==='true');
                await page.locator('#blades button[data-value="4"]').click();
                ensure('bladeSelect',await page.locator('#blades button[data-value="4"]').getAttribute('aria-pressed')==='true');
                await page.locator('#speed button[data-value="0.1"]').click();
                ensure('slowPlayback',await page.locator('#speed button[data-value="0.1"]').getAttribute('aria-pressed')==='true');
                await page.locator('#pulses').click();
                ensure('pulseToggle',await page.locator('#pulses').getAttribute('aria-pressed')==='false');
                await page.locator('#vibrationExample').click();
                ensure('vibrationToggle',await page.locator('#vibrationExample').getAttribute('aria-pressed')==='true');
                await page.locator('#pause').click();
                ensure('pause',await page.locator('#pause').getAttribute('aria-pressed')==='true');
                await page.locator('#pause').click();
                ensure('resume',await page.locator('#pause').getAttribute('aria-pressed')==='false');
                await page.locator('#sound').click();
                await page.waitForFunction(()=>document.getElementById('sound').getAttribute('aria-pressed')==='true'||document.getElementById('audioStatus').textContent.length>0,undefined,{timeout:10000});
                ensure('audioStart',await page.locator('#sound').getAttribute('aria-pressed')==='true');
                await page.locator('#volume').fill('20');
                ensure('volume',await page.locator('#volumeValue').innerText()==='20%');
                await page.locator('#reset').click();
                ensure('reset',await page.evaluate(()=>document.getElementById('throttle').value==='0'&&document.getElementById('sound').getAttribute('aria-pressed')==='false'&&document.getElementById('vibrationExample').getAttribute('aria-pressed')==='false'));
                ensure('noPageErrors',errors.length===0);
                entry.propFunctionalPass=true;
              }
              if(file==='simulator.html'){
                const card=page.locator('#prop-vibration-lab a[aria-label="프롭 진동 실습 시작"]');
                const target=await card.getAttribute('href');
                if(target!=='./prop-vibration-lab.html')throw Error('PropLab card target incorrect: '+target);
                await Promise.all([page.waitForURL('**/prop-vibration-lab.html',{timeout:15000}),card.click({timeout:15000})]);
                await page.locator('#motors button').first().waitFor({state:'visible',timeout:15000});
                await Promise.all([page.waitForURL('**/simulator.html',{timeout:15000}),page.locator('[data-tsd-common-nav] a[href="./simulator.html"]').click({timeout:15000})]);
                entry.propCardRoundTrip=true;
              }
              entry.designPass=entry.pass&&entry.visualDifferences.length===0&&entry.heroBackgroundMatch&&entry.heroPatternMatch&&entry.menuLabelsMatch&&entry.menuTargetsMatch&&entry.linkChecks.every(x=>x.status===200)&&entry.axe.length===0&&entry.headerCapture===true&&entry.commonCssResponse.status===200;
            } catch(e) {entry.pass=false;entry.designPass=false;entry.failure=String(e);await page.screenshot({path:'/tmp/tsd-header-results/'+file+'-'+width+'-failure.png',timeout:10000}).catch(()=>{});}
            result.push(entry); console.log(JSON.stringify(entry));await context.close();
          }
          const external={url:'https://tsd-prop-sound-lab.amiablecoati.chatgpt.site/',comparable:false};
          const externalPage=await browser.newPage();
          try {
            const response=await externalPage.goto(external.url,{waitUntil:'domcontentloaded',timeout:25000});
            external.http=response?.status();external.finalUrl=externalPage.url();external.title=await externalPage.title();
            const ids=['motors','airframe3d','drone','track','spectrum','throttle','roll','pitch','yaw','sound','reset'];
            external.controls=await externalPage.evaluate(ids=>Object.fromEntries(ids.map(id=>[id,!!document.getElementById(id)])),ids);
            external.comparable=external.http===200&&Object.values(external.controls).every(Boolean);
            await externalPage.screenshot({path:'/tmp/tsd-header-results/external-prop.png',timeout:10000}).catch(()=>{});
          }catch(e){external.error=String(e)}
          fs.writeFileSync('/tmp/tsd-header-results/external-prop-audit.json',JSON.stringify(external,null,2));
          console.log(JSON.stringify({externalPropAudit:external}));
          await externalPage.close();
          await browser.close();
          fs.writeFileSync('/tmp/tsd-header-results/results.json',JSON.stringify(result,null,2));
          fs.writeFileSync('/tmp/tsd-header-results/design-audit.json',JSON.stringify({checkedCommit,baselines,summary:{smoke:result.filter(x=>x.pass).length,design:result.filter(x=>x.designPass).length},results:result},null,2));
          console.log(JSON.stringify({checkedCommit,smoke:result.filter(x=>x.pass).length,design:result.filter(x=>x.designPass).length,total:result.length}));
          const unresolvedScripts=sourceAudit.filter(x=>!x.scriptsIdentical).map(x=>x.file);
          const externalPassed=external.comparable===true;
          const propRoundTrips=result.filter(x=>x.file==='simulator.html'&&x.propCardRoundTrip===true).length;
          const propFunctional=result.filter(x=>x.file==='prop-vibration-lab.html'&&x.propFunctionalPass===true).length;
          console.log(JSON.stringify({releaseGate:{unresolvedScripts,externalPassed,propRoundTrips,propFunctional,allHeaderTestsPassed:result.every(x=>x.pass&&x.designPass)}}));
          if(result.some(x=>!x.pass||!x.designPass)||unresolvedScripts.length||!externalPassed||propRoundTrips!==4||propFunctional!==4) process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsd-header-browser-results
          path: /tmp/tsd-header-results
          retention-days: 30
