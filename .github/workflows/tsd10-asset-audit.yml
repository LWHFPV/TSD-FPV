name: TSD10 RevS8 mesh and category audit
on:
  push:
    branches:
      - review/tsd10-revs9-unify-preview
    paths:
      - 'audit/tsd10-revs9-asset-check.cjs'
      - 'tsd10-revs8-preview.html'
      - 'tsd10-revs8-assets/**'
      - '.github/workflows/tsd10-asset-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'audit/**'
      - 'tsd10-preview.html'
      - 'tsd10-revs8-preview.html'
      - 'tsd10-revs8-assets/**'
      - '.github/workflows/tsd10-asset-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate TSD10 4 assembly variants
        run: node audit/tsd10-revs9-asset-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsd10-mesh-audit
          path: audit/tsd10-revs9-asset-audit-result.json
          if-no-files-found: warn
