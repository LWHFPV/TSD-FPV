name: TSD live header release verification
on:
  push:
    branches: [review/tsd-header-browser-check-20261126]
    paths: ['.github/workflows/tsd-live-header-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e53f1c147a2820effd1579edc8d710f33c15fb77
          lfs: false
      - name: Compare live HTTPS files with merged source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request, concurrent.futures
          files=['TSD_EOIR_V24_Mission.html','blackbox-analyzer.html','contact.html','drone-design.html','education.html','equipment-lab.html','flight-safety.html','fpv-flight-lab.html','link-budget.html','long-range-calculator.html','prop-vibration-lab.html','simulator.html','tsd-aero-common.css','tsd-qgc-mission-lab.html']
          def check(file):
              expected=pathlib.Path(file).read_bytes()
              try:
                  url='https://lwhfpv.github.io/TSD-FPV/'+file+'?release=e53f1c147&qa='+str(int(time.time()))
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'TSD-release-QA'}),timeout=25) as response:
                      actual=response.read()
                      return {'file':file,'status':response.status,'matches':actual==expected,'expectedSHA256':hashlib.sha256(expected).hexdigest(),'actualSHA256':hashlib.sha256(actual).hexdigest()}
              except Exception as exc:
                  return {'file':file,'matches':False,'error':str(exc)}
          for attempt in range(12):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  results=list(pool.map(check,files))
              print(json.dumps({'attempt':attempt+1,'matches':sum(r['matches'] for r in results),'total':len(results),'results':results}),flush=True)
              if all(r['matches'] for r in results):break
              if attempt<11:time.sleep(20)
          pathlib.Path('/tmp/tsd-live-release.json').write_text(json.dumps(results,indent=2))
          if not all(r['matches'] for r in results):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsd-live-release
          path: /tmp/tsd-live-release.json
          retention-days: 7
