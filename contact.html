<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="TSD Aero Systems의 드론 교육·행사 문의 안내"><title>교육·행사 문의 | TSD Aero Systems</title><style>
:root {
  color-scheme: dark;
  --bg: #08111f;
  --panel: #142338;
  --accent: #38bdf8;
  --text: #eaf2fc;
  --muted: #a9bbcf;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Malgun Gothic", sans-serif;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #08111ff0;
  border-bottom: 1px solid #28405a;
  padding: 15px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}
.logo {
  font-weight: 800;
  font-size: 20px;
  color: var(--accent);
}
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}
nav a:hover { color: var(--accent); }
section {
  padding: 65px 7%;
  max-width: 1200px;
  margin: auto;
}
h1 {
  font-size: clamp(32px, 6vw, 60px);
  line-height: 1.2;
}
h2 {
  font-size: 29px;
  color: var(--accent);
}
.hero {
  max-width: none;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: radial-gradient(
    circle at 80% 20%,
    #16537a 0%,
    #08111f 55%
  );
}
.hero p {
  font-size: 19px;
  max-width: 720px;
  color: #c5d5e8;
}
.btn {
  display: inline-block;
  background: var(--accent);
  color: #06111c;
  border-radius: 9px;
  padding: 12px 20px;
  font-weight: bold;
  text-align: center;
  margin: 5px 8px 5px 0;
}
.btn:hover { background: #7dd3fc; }
.btn-outline {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-outline:hover {
  background: #17354c;
  color: white;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 18px;
}
.card, .simulator-box {
  background: var(--panel);
  border: 1px solid #29405c;
  border-radius: 16px;
  padding: 22px;
}
.card h3 { margin-top: 0; }
.muted { color: var(--muted); }
.simulator-box {
  max-width: 900px;
  padding: 32px;
}
.simulator-box h3 {
  font-size: 24px;
  margin-top: 0;
}
.features {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 22px 0;
}
.features span {
  background: #223b55;
  border: 1px solid #365a78;
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
}
footer {
  border-top: 1px solid #28405a;
  text-align: center;
  padding: 35px;
  color: #9cb1c8;
}
@media (max-width: 600px) {
  header { padding: 12px 5%; }
  nav { font-size: 13px; gap: 10px; }
  section { padding: 45px 5%; }
  .simulator-box { padding: 20px; }
}
.lab-banners { display: grid; gap: 24px; }
.lab-banner { max-width: none; width: 100%; border-left: 4px solid var(--accent); }
.lab-banner p { max-width: 800px; }
.lab-label { color: var(--accent); font-size: 12px; font-weight: bold; letter-spacing: 1.6px; margin-bottom: 12px; }
.lab-note { font-size: 13px; margin-bottom: 0; }
.mission-banner { border-left-color: #e5c45a; }
.mission-banner .lab-label { color: #e5c45a; }
.mission-banner .btn { background: #e5c45a; }
.mission-banner .btn:hover { background: #f6dc8b; }
section[id], article[id] { scroll-margin-top: 95px; }
.btn:focus-visible, nav a:focus-visible { outline: 3px solid white; outline-offset: 5px; }

nav a[aria-current="page"] { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.page-shell { min-height: calc(100vh - 170px); }
.page-heading { text-align: center; margin-bottom: 34px; }
.page-heading h1 { color: var(--accent); font-size: clamp(30px, 4vw, 42px); margin: 0 0 14px; }
.page-heading p { margin: 0; }
</style></head><body>
<header><a class="logo" href="./index.html">TSD Aero Systems</a><nav aria-label="주 메뉴"><a href="./education.html">체험교육</a><a href="./index.html">기술연구소</a><a href="./contact.html" aria-current="page">문의</a></nav></header>
<main class="page-shell"><section id="contact">
  <div class="page-heading"><h1>교육·행사 문의</h1></div>
  <p>
    학교·기관 대상 드론 체험교육,
    FPV 기술교육 및 행사 프로그램을
    위한 안내 공간입니다.
  </p>
  <p class="muted">
    공식 연락처와 신청 기능은 추후 등록 예정입니다.
  </p>
</section></main>
<footer>
  © 2026 TSD Aero Systems
</footer>
</body></html>
