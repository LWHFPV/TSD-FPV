<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSD P0 브이월드 실제 3D 지형</title><style>body{margin:0;background:#0b1925;color:#eef;font:14px system-ui}header{padding:12px}input,button{padding:10px;font:inherit;margin:3px}input{width:min(95%,430px)}#map{height:75vh;background:#263b49}#status{padding:12px;white-space:pre-wrap}small{color:#c0c9d0}</style></head><body><header><b>TSD P0 · 브이월드 실제 3D 지형 연결</b><div><small>공식 WebGL 3.0 API · 북한산 백운대 중심 · 가상 지형 대체 없음</small></div><label>브이월드 API 인증키 <input id="key" placeholder="본인 브이월드 API 인증키" autocomplete="off"></label><button id="load">실제 3D 지도 시작</button><button id="oblique" disabled>경사 시점</button><button id="nadir" disabled>직하방 -90°</button></header><div id="map"></div><div id="status">인증키 입력 후 지도 시작을 누르세요. HTTPS GitHub Pages에서 실행하세요.</div><script>
const status=document.getElementById('status'),b=id=>document.getElementById(id);let viewer=null;
function camera(pitch){if(!viewer||!window.Cesium)return;viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(126.977,37.6587,3500),orientation:{heading:0,pitch:Cesium.Math.toRadians(pitch),roll:0}});status.textContent='카메라 '+pitch+'° · 실제 3D 지도 렌더링은 브이월드 서버 연결 상태에 따름'}
b('load').onclick=()=>{const key=b('key').value.trim();if(!/^[a-zA-Z0-9-]{12,128}$/.test(key)){status.textContent='인증키 형식을 확인하세요';return}if(window.vw){status.textContent='이미 초기화되었습니다. 새 인증키 적용은 새로고침 후 가능합니다.';return}status.textContent='공식 브이월드 3D API 로딩 중...';const s=document.createElement('script');s.src='https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey='+encodeURIComponent(key);s.onload=()=>{try{if(!window.vw){throw Error('vw 객체가 생성되지 않았습니다')}const options={mapId:'map',initPosition:new vw.CameraPosition(new vw.CoordZ(126.977,37.6587,3500),new vw.Direction(0,-65,0)),logo:true,navigation:true};const map=new vw.Map();map.setOption(options);vw.ws3dInitCallBack=()=>{viewer=window.ws3d?.viewer||null;status.textContent=viewer?'3D 엔진 초기화 완료 · 실제 지형 표시 여부를 화면에서 확인하세요':'지도 콜백 호출 · 뷰어 미확인';b('oblique').disabled=b('nadir').disabled=!viewer};map.start();status.textContent='지도 엔진 초기화 요청 · 지형 데이터 로딩 대기';}catch(e){status.textContent='초기화 실패: '+e.message}};s.onerror=()=>status.textContent='브이월드 스크립트 로드 실패: 네트워크 또는 인증/도메인 설정 확인';document.head.append(s)};
b('oblique').onclick=()=>camera(-65);b('nadir').onclick=()=>camera(-90);
</script></body></html>
