<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSD EO/IR Rev16 검토본</title><style>body{background:#101923;color:#ecf4ff;font:16px system-ui;padding:24px}main{max-width:580px;margin:10vh auto}progress{width:100%}button{font:inherit;padding:9px}</style></head><body><main><h1>TSD EO/IR Rev16</h1><p id="status" role="status">검토본 원본 불러오는 중…</p><progress id="progress" max="25" value="0"></progress><noscript>JavaScript가 필요합니다.</noscript><p><button id="retry" hidden>다시 실행</button></p></main><script>
(async()=>{const status=document.getElementById('status'),progress=document.getElementById('progress'),retry=document.getElementById('retry');retry.onclick=()=>location.reload();try{if(!window.isSecureContext||!crypto.subtle)throw Error('HTTPS 보안 연결이 필요합니다.');const parts=new Array(25);let loaded=0;for(let i=0;i<25;i+=5){await Promise.all(Array.from({length:Math.min(5,25-i)},(_,k)=>i+k).map(async n=>{const r=await fetch('./eoir-review/rev16/part-'+String(n).padStart(2,'0')+'.txt',{cache:'default'});if(!r.ok)throw Error('파일 '+n+' HTTP '+r.status);parts[n]=new Uint8Array(await r.arrayBuffer());progress.value=++loaded;status.textContent='검토본 불러오는 중 '+loaded+'/25';}));}const total=parts.reduce((sum,b)=>sum+b.length,0);if(total!==5152723)throw Error('원본 크기 불일치');const bytes=new Uint8Array(total);let offset=0;for(const p of parts){bytes.set(p,offset);offset+=p.length;}status.textContent='원본 무결성 검증 중…';const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!=='b59b419167eebd4aa1c864f3abd8e9cafbe0a93b48968472a5ca1bced31f0c91')throw Error('원본 SHA-256 불일치');const source=new TextDecoder('utf-8',{fatal:true}).decode(bytes);document.open();document.write(source);document.close();}catch(e){status.textContent='검토본 실행 실패: '+e.message;retry.hidden=false;}})();
</script></body></html>
