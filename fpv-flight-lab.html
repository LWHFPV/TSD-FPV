&lt;script id=&quot;codex-visualization-widget-state&quot; type=&quot;application/json&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  let initialGlobals={};try{initialGlobals=parse(initialStateElement?.textContent ?? &quot;{}&quot;)}catch(_){initialGlobals={}};
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

        return value;
      },

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();

&lt;/style&gt;&lt;details class=&quot;r29-profile&quot;&gt;&lt;summary&gt;&lt;b&gt;표준 교육 기체 · TSD10&lt;/b&gt; &lt;span&gt;6S · 10인치 · 37% 기준&lt;/span&gt; &lt;small&gt;제원 / 안내&lt;/small&gt;&lt;/summary&gt;&lt;p&gt;V3115 900KV · 440mm True X · 10×5×3 · 6S 5200mAh · 카메라 35°. 총중량 2,100g(건조 1,400g + 배터리 700g), 프롭 18.1g/개, 120C는 기존 교육 시험의 가정값입니다. Rev.R30 · 기준 PID가 안정된 비행을 보여주도록 보정한 교육용 각속도 모델입니다. 각속도는 정규화된 가상 구동기로 계산하고 모터 출력·추력·배터리는 시각화용 근사 모델로 구분합니다. 외란·잡음 기본 0, 호버 기준 37%. 실기체 성능·안전고도·최적 PID를 보증하지 않습니다.&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;r15-panel&quot; id=&quot;r15-panel-experiment&quot;&gt;&lt;div id=&quot;tsd-columns&quot;&gt;&lt;div id=&quot;tsd-left&quot;&gt;&lt;div class=&quot;views&quot;&gt;&lt;section&gt;&lt;h3&gt;A · 추적 카메라&lt;/h3&gt;&lt;canvas aria-label=&quot;가상 비행장에서 이동하며 기동하는 드론의 외부 시점&quot; id=&quot;droneA&quot; role=&quot;img&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;tabular-nums&quot; id=&quot;angleA&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;r23-camera-head&quot;&gt;&lt;h3&gt;B · FPV 카메라&lt;/h3&gt;&lt;select aria-label=&quot;FPV 카메라 시점&quot; id=&quot;r23-camera&quot;&gt;&lt;option value=&quot;forward&quot;&gt;정면 보기&lt;/option&gt;&lt;option value=&quot;mount&quot;&gt;35° 장착 시점&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;canvas aria-label=&quot;비행 위치와 기체 자세를 함께 반영하는 FPV 카메라&quot; id=&quot;droneB&quot; role=&quot;img&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;tabular-nums&quot; id=&quot;angleB&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;tsd-attitude&quot;&gt;&lt;div class=&quot;tsd-att-head&quot;&gt;&lt;strong&gt;3D 자세 모니터&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;30초 동기화&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tsd-att-grid&quot;&gt;&lt;canvas aria-label=&quot;3D FPV 쿼드콥터 자세&quot; id=&quot;attQuad&quot;&gt;&lt;/canvas&gt;&lt;canvas aria-label=&quot;롤 경사각 눈금과 포인터가 있는 인공 수평계&quot; id=&quot;attHorizon&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;&lt;div class=&quot;tsd-att-numbers tabular-nums&quot; id=&quot;attNumbers&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;div id=&quot;r24-pid-inline&quot;&gt;&lt;section id=&quot;bfPanel&quot;&gt;
&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;PID 튜닝&lt;/h3&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;PID 입력 범위 및 모드 안내&quot; title=&quot;PID 입력 범위 및 모드 안내&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;&lt;strong&gt;PID 입력 범위 및 모드 안내&lt;/strong&gt;&lt;div class=&quot;text-small&quot;&gt;OFF는 수동 입력값 복원 · RP/RPY는 슬라이더 설정 유지 · RP의 Yaw는 수동값 유지&lt;/div&gt;&lt;div class=&quot;text-small&quot; style=&quot;padding:10px;border:1px solid var(--border);border-radius:8px;margin:8px 0&quot;&gt;&lt;strong&gt;교육용 기준점&lt;/strong&gt; · Roll 45/80/30/40/120 · Pitch 47/84/34/46/125 · Yaw 45/80/0/0/120&lt;br/&gt;고정 비교 조건: 기준 호버 스로틀 37%, 외란 5(상대 단위), 자이로 잡음 0.5(상대 단위), 같은 기동·같은 시작 상태. 기준값은 비교 출발점입니다. 실제 기체 최적값이 아닙니다. 모든 기동에서 지속적인 외란과 제어 반응을 계산합니다.&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;빨강: 입력 범위 위반 · 주황: 교육용 모델에서 불안정 가능성. 실제 비행 가능 여부를 판정하지 않습니다. P/I/D/D 최대 0–250 · FF 직접 입력 0–2000은 교육용 확장 범위입니다. Betaflight 2026.6.2 펌웨어 및 슬라이더 FF 상한은 1000입니다.&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;D 최소는 기본 감쇠입니다. 기본 D가 0이면 D 최대와 관계없이 D항은 꺼집니다. 기본 D보다 D 최대가 클 때 목표 각속도 변화 및 필터링된 자이로 변화에 따른 교육용 동적 감쇠가 적용됩니다. 실제 펌웨어의 Dmax 필터·TPA 연산은 별도입니다. FF는 기동 시작·변화·정지의 목표 각속도 변화에 반영됩니다. 슬라이더는 Betaflight 2026.6.2 정수 백분율·단정밀도 환산 모델입니다. 비행 반응은 별도의 교육용 근사 모델이며 펌웨어 PID 출력과 동일하지 않습니다.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;text-small text-destructive&quot; id=&quot;pidError&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;&lt;div class=&quot;text-small&quot; style=&quot;color:#52627a&quot;&gt;기준 PID는 정상 비행입니다. 변경한 축의 기동(롤→롤 360°, 피치→플립 360°, 요→요 180°)을 재생하세요. I는 상승·하강, D/Dmax는 급기동·프롭워시에서 비교합니다. Yaw D=0 및 Dmax=0은 정상이며, D=0이면 Dmax 단독 변경은 비활성입니다. 반응 크기는 교육용 정규화 모델로 실제 기체 예측값이 아닙니다.&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;text-small&quot; id=&quot;pidWarnings&quot;&gt;&lt;/div&gt;
&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;r15-card&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;비행 결과 요약&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm tabular-nums&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;30초 실험 · 기동 후 측정&lt;/th&gt;&lt;th&gt;현재 PID&lt;/th&gt;&lt;th&gt;기준 PID&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;metrics&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div id=&quot;tsd-right&quot;&gt;&lt;section class=&quot;tsd-bb&quot; id=&quot;blackboxPanel&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;PID · 30초 시간응답&lt;/h3&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;그래프 해석 및 샘플링&quot; title=&quot;그래프 해석 및 샘플링&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;&lt;strong&gt;그래프 해석 및 샘플링&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;점선: 목표 각속도 · 실선: 계산된 자이로 각속도 · 수직선: 현재 영상 시간. 같은 제어 데이터로 표시합니다. 시간 그래프는 50Hz 간격 미리보기입니다. 스펙트럼은 기동 후 유효한 500Hz 기록(최소 500표본, 최대 4096표본)의 Hann 창 단측 진폭입니다. 필터 자이로와 목표 오차는 별개이며 250Hz 초과 성분은 구분할 수 없습니다. 실제 BBL이 아닌 계산 데이터입니다.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;section class=&quot;r15-card r15-exp-controls&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;기동 · 재생&lt;/h3&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;기동 및 카메라 안내&quot; title=&quot;기동 및 카메라 안내&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;&lt;strong&gt;기동 및 카메라 안내&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;공통 목표 고도 6m · 직진은 펀치 없는 단순 전진. 다른 기동은 20m 전진 후 시작합니다. 스플릿 S는 준비 상승 → 반 롤·하강 반 루프 → 6m 복귀·반대 방향 비행. 요 턴은 180°, 백플립·롤 턴은 360°입니다. 펀치 기본 0.5초 / +22%p이며 이륙·단순 직진에는 적용하지 않습니다. 설정 변경 시 같은 시작 상태에서 다시 계산합니다.&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;B는 가상 비행장입니다. 정면 보기는 기수축 0° 교육용 시점, 35° 장착 시점은 실제 고정 장착각을 반영합니다. 기동 후 경로 보조는 실제 위치·속도에 따라 자세 명령만 조정합니다.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;viz-row r15-maneuvers&quot;&gt;&lt;button aria-label=&quot;이륙 · 안정화&quot; class=&quot;btn&quot; id=&quot;test-takeoff&quot; title=&quot;이륙 · 안정화&quot;&gt;이륙&lt;/button&gt;&lt;button aria-label=&quot;직진 · 스로틀&quot; class=&quot;btn&quot; id=&quot;test-throttle&quot; title=&quot;직진 · 스로틀&quot;&gt;직진&lt;/button&gt;&lt;button aria-label=&quot;스플릿 S · 좌 롤&quot; class=&quot;btn&quot; id=&quot;test-split-left&quot; title=&quot;스플릿 S · 좌 롤&quot;&gt;S 좌&lt;/button&gt;&lt;button aria-label=&quot;스플릿 S · 우 롤&quot; class=&quot;btn&quot; id=&quot;test-split-right&quot; title=&quot;스플릿 S · 우 롤&quot;&gt;S 우&lt;/button&gt;&lt;button aria-label=&quot;하강 → 스로틀 회복&quot; class=&quot;btn&quot; id=&quot;test-drop&quot; title=&quot;하강 → 스로틀 회복&quot;&gt;하강&lt;/button&gt;&lt;button aria-label=&quot;상승 → 스로틀 회복&quot; class=&quot;btn&quot; id=&quot;test-climb&quot; title=&quot;상승 → 스로틀 회복&quot;&gt;상승&lt;/button&gt;&lt;button aria-label=&quot;요 턴 180°&quot; class=&quot;btn&quot; id=&quot;test-yaw&quot; title=&quot;요 턴 180°&quot;&gt;요 180°&lt;/button&gt;&lt;button aria-label=&quot;백플립 360°&quot; class=&quot;btn&quot; id=&quot;test-flip&quot; title=&quot;백플립 360°&quot;&gt;플립 360°&lt;/button&gt;&lt;button aria-label=&quot;롤 턴 360°&quot; class=&quot;btn&quot; id=&quot;test-roll&quot; title=&quot;롤 턴 360°&quot;&gt;롤 360°&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;viz-controls r15-flight-inputs&quot;&gt;

&quot;&quot;&gt;&lt;section class=&quot;r15-card&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;기존 자료 비교&lt;/h3&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;시험 근거와 제한&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;V3115 900KV/HQ1050-3 정적 부하시험 23~24V. LR10×5×3 동일성 및 실기체 전압 조건 미확인. 60% 원표 전류 408.08A 이상치는 제외하고 582W/24V로 추정. 10~100% 구간만 선형 보간. &lt;a href=&quot;https://www.ligpower.com/product/V3115-fpv-motor.html&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&gt;제조사 자료&lt;/a&gt;. BBL은 Betaflight 2025.12.2, 최대 25초 요약이며 다른 기체/조건을 TSD10 보정에 사용하지 않습니다.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;label&gt;제조사 시험 스로틀 (%) &lt;input class=&quot;form-control&quot; id=&quot;r16-duty&quot; max=&quot;100&quot; min=&quot;10&quot; step=&quot;1&quot; type=&quot;number&quot; value=&quot;37&quot;/&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;text-small&quot; id=&quot;r16-bench&quot;&gt;&lt;/div&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;text-small&quot; id=&quot;r16-model&quot;&gt;&lt;/div&gt;&lt;label&gt;실제 BBL 비교 자료&lt;select class=&quot;form-select&quot; id=&quot;r16-bbl&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;div aria-live=&quot;polite&quot; class=&quot;text-small&quot; id=&quot;r16-bbl-result&quot;&gt;&lt;/div&gt;&lt;p class=&quot;text-small&quot;&gt;10인치H743.BBL은 해독 가능한 헤더 없음. 실기체 검증 보류.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;r15-card&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;물리엔진 비교&lt;/h3&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;물리엔진 비교 상세 안내&quot; title=&quot;물리엔진 비교 상세 안내&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;&lt;strong&gt;물리엔진 비교 상세 안내&lt;/strong&gt;&lt;div class=&quot;text-small&quot;&gt;기본 OFF: 기존 모델 유지. ON: 축간거리 기반 추정 관성·Quaternion 적분. 건조중량 60%를 외곽 질점, 나머지를 중앙 상자로 가정, 배터리 중심 -30mm. 실제 TSD10 실측값 아님. 회전수 제곱 추력·유도동력 기반 전류·추정 내부저항·교육용 저전압 출력 제한·제곱 공기저항 적용. 최대추력·효율·내부저항은 가정값이며 실측 아님. 호버 37%는 입력 기준으로만 유지하며 실제 평형은 보장하지 않음. 개선 모델은 R18 추력 기준 믹서(공통 추력 명령 우선, 포화 시 축별 보정 공통 축소)를 사용. PID 출력은 명목 전압에서 단위당 40 rad/s²의 교육용 각가속도 척도로 변환하며 실제 Betaflight 믹서와 동일하지 않음.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;label&gt;&lt;input id=&quot;physics-v2&quot; type=&quot;checkbox&quot;/&gt; 추정 물리·Quaternion 적용&lt;/label&gt;&lt;br/&gt;&lt;br/&gt;&lt;label&gt;&lt;input id=&quot;physics-hover&quot; type=&quot;checkbox&quot;/&gt; 단순 전진 대신 정지 호버 시험 (고도 자동 보정 OFF, 입력 스로틀 직접 사용)&lt;/label&gt;&lt;div style=&quot;margin-top:12px;border-top:1px solid var(--border);padding-top:10px&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;strong&gt;37% 교육용 호버 보정&lt;/strong&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;호버 보정 도움말&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;현재 입력 중량·부품 기준 완충 정적 평형의 추력계수만 가상 보정합니다. 실제 기체 측정값이 아니며 고도 제어는 개입하지 않습니다. 하드웨어 변경이나 추정 물리 OFF 시 해제됩니다. 배터리 소모 후 평형은 달라질 수 있습니다. 제조사 시험 자료에는 영향을 주지 않습니다.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; id=&quot;r17-calibrate&quot; type=&quot;button&quot;&gt;현재 제원으로 교육용 보정&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;r17-clear&quot; type=&quot;button&quot;&gt;보정 해제&lt;/button&gt;&lt;p class=&quot;text-small&quot; id=&quot;r17-status&quot; role=&quot;status&quot;&gt;교육용 보정 OFF&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;r15-card&quot;&gt;&lt;div class=&quot;r15-card-head&quot;&gt;&lt;h3&gt;모델 안내&lt;/h3&gt;&lt;/div&gt;&lt;details class=&quot;r15-help&quot;&gt;&lt;summary aria-label=&quot;모델 및 측정 기준&quot; title=&quot;모델 및 측정 기준&quot;&gt;?&lt;/summary&gt;&lt;div class=&quot;r15-help-body&quot;&gt;&lt;strong&gt;모델 및 측정 기준&lt;/strong&gt;&lt;details&gt;&lt;summary&gt;모델 및 측정 기준&lt;/summary&gt;&lt;div class=&quot;text-small&quot;&gt;PID → 모터 혼합·출력 제한·모터 지연 → 각속도·자세 → 추력·중력·위치 → 지면 충돌을 1ms 간격으로 계산합니다. 500Hz로 기록하며 기체·FPV·계측·그래프가 같은 결과를 사용합니다. 기동 버튼은 가상 조종사의 목표 자세를 지정하며, 기동 후에도 계산이 이어집니다. 고도 회복 스로틀 보조가 포함되어 있어 실제 Acro 비행과 다릅니다. 모든 기동의 안정화 목표 고도는 6m이며 강제 복귀하지 않습니다. 이륙은 0.16m에서 출발하고 나머지는 6m에서 전진합니다. 스플릿 S는 20m 전진 후 22m 준비 상승, 실제 고도와 수직 속도 조건 충족 시 반 롤 0.5초·반 루프 1초를 수행하고 6m로 회복합니다. 요 턴은 목표 180°이며 관성 때문에 이동 방향 전환에는 시간이 걸립니다. 각 축 회전을 근사한 교육 모델로 완전한 강체 6DOF나 Betaflight 펌웨어 재현이 아닙니다. 모터·배터리·프롭 제원은 근사 추력·관성·지연·전압강하·소모량에 반영하며 제조사 실측 곡선은 사용하지 않습니다. 120Hz 센서 잡음이 D 제어량·모터·기체 응답을 통해 전달됩니다. 화면 주사율보다 빠른 떨림은 0.1배 재생과 스펙트럼으로 확인하세요. 비행음은 제공된 아밍음의 짧은 반복 구간을 사용합니다. 추력, 기체 기울기, 회전축, 모터 출력의 진동에 따라 원음의 높이와 여러 주파수 대역을 섞어 재생합니다. D 부하는 온도 예측이 아닙니다.&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;button class=&quot;btn r15-return&quot; data-r15-go=&quot;experiment&quot; type=&quot;button&quot;&gt;실험 화면으로 돌아가기&lt;/button&gt;&lt;/div&gt;&lt;style&gt;#fpv-lab [hidden]{display:none!important}.r29-profile,.r29-extra{border:1px solid var(--border,#64748b55);border-radius:8px;padding:8px 10px}.r29-profile summary,.r29-extra summary{cursor:pointer;font-size:13px}.r29-profile summary span{margin-left:8px}.r29-profile summary small{float:right}.r29-profile p,.r29-extra p{margin:7px 0}.r29-extra{margin-top:8px}.r29-extra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.r29-extra-grid section{min-width:0}@media(max-width:800px){.r29-extra-grid{grid-template-columns:1fr}.r29-profile summary small{float:none;margin-left:6px}}&lt;/style&gt;&lt;/div&gt;

 function makeAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw Error('AudioContext unavailable');
  const ac=new AC();
  // Single output bus across voice transitions. The limiter is a listening aid,
  // not a calibrated sound-pressure or motor-load measurement.
  const master=ac.createDynamicsCompressor();
  master.threshold.value=-8;master.knee.value=6;master.ratio.value=12;
  master.attack.value=.003;master.release.value=.09;
  master.connect(ac.destination);
  return {ac,master,buffer:null,voice:null,retiring:null};
 }

 function motorAudioTrack(trajectory){
  const history=new Float32Array(trajectory.length*5);
  if(!trajectory.length)return history;
  const first=trajectory[0];
  const steady=first.motors.slice(),recent=first.motors.slice();
  const pBase=first.terms.map(term=&gt;term.P),dBase=first.terms.map(term=&gt;term.D);
  const deltas=new Float32Array(4);
  let lowEnergy=0,fastEnergy=0,pEnergy=0,dEnergy=0;
  for(let n=0;n&lt;trajectory.length;n++){
   const frame=trajectory[n];
   let slow=0,fast=0,p=0,d=0;
   for(let i=0;i&lt;4;i++){
    const motor=frame.motors[i];
    steady[i]+=.045*(motor-steady[i]);
    recent[i]+=.29*(motor-recent[i]);
    deltas[i]=recent[i]-steady[i];
    slow+=deltas[i]**2/4;
    fast+=(motor-recent[i])**2/4;
   }
   for(let i=0;i&lt;3;i++){
    const term=frame.terms[i];
    pBase[i]+=.23*(term.P-pBase[i]);
    dBase[i]+=.23*(term.D-dBase[i]);
    p+=(term.P-pBase[i])**2/3;
    d+=(term.D-dBase[i])**2/3;
   }
   lowEnergy+=(slow-lowEnergy)*.035;
   fastEnergy+=(fast-fastEnergy)*.065;
   pEnergy+=(p-pEnergy)*.046;
   dEnergy+=(d-dEnergy)*.046;
   const [a,b,c,d0]=deltas;
   const roll=(a+d0-b-c)/2,pitch=(c+d0-a-b)/2,yaw=(b+d0-a-c)/2;
   const strongest=[roll,pitch,yaw].reduce((a,b)=&gt;Math.abs(a)&gt;Math.abs(b)?a:b);
   history[5*n]=Math.sqrt(lowEnergy);
   history[5*n+1]=Math.sqrt(fastEnergy);
   history[5*n+2]=Math.sqrt(pEnergy);
   history[5*n+3]=Math.sqrt(dEnergy);
   history[5*n+4]=Math.tanh(strongest/.09);
  }
  return history;
 }

 function motorAudioTargets(frame,history=null,rotationEnd=Infinity){
  const [a,b,c,d]=frame.motors;
  const drive=(a+b+c+d)/4;
  const clamp01=value=&gt;Math.max(0,Math.min(1,value));
  const rotation=(rate,limit)=&gt;clamp01((Math.abs(rate)*180/Math.PI-18)/limit);
  const [rollRate,pitchRate,yawRate]=frame.rates;
  // The signed motor pairs use the same X-mix as FlightEngine.
  const rollMix=(a+d-b-c)/2;
  const pitchMix=(c+d-a-b)/2;
  const yawMix=(b+d-a-c)/2;
  // Rotation alone must not invent extra motor noise; actuator differential
  // gates the axis coloration. Collective drive controls pitch independently.
  const axisLoad=(mix,rate,limit)=&gt;{const load=clamp01(Math.abs(mix)/.28);return load*(.75+.25*rotation(rate,limit));};
  const roll=axisLoad(rollMix,rollRate,280),pitch=axisLoad(pitchMix,pitchRate,280),yaw=axisLoad(yawMix,yawRate,220);
  const collective=drive-.37;
  const descent=clamp01((frame.velocity[2]-2)/7);
  const wash=clamp01(frame.wash/.65);
  const recovery=clamp01((drive-frame.stickThrottle-.055)/.38)*descent;
  const sample=Math.round(frame.t*500)*5;
  const slow=history?.[sample]??0,fast=history?.[sample+1]??0;
  const p=history?.[sample+2]??0,dTerm=history?.[sample+3]??0;
  const pFlutter=clamp01((fast-.013)/.063)*clamp01((p-.038)/.13)*(p/(p+dTerm*.65+.02));
  const dTexture=clamp01((fast-.010)/.053)*clamp01((dTerm-.045)/.20)*(dTerm/(dTerm+p*1.6+.04));
  const settling=frame.t&gt;=rotationEnd&amp;&amp;frame.t&lt;=rotationEnd+1.2;
  const tracking=Math.max(...frame.angles.map((angle,i)=&gt;{
   const error=frame.reference[i]-angle;
   return Math.abs(Math.atan2(Math.sin(error),Math.cos(error)));
  }));
  // A weak response alone doesn't create noise. Low-frequency coloration
  // requires actual changing actuator loads, including after stick release.
  const body=clamp01((slow-.013)/.080)*Math.max(settling ? .90 : .38,clamp01((tracking-.15)/1.0)*.72);
  const signedLoad=history?.[sample+4]??0;
  return {
   body:.46*body+.27*pFlutter,
   detail:.90*dTexture+.16*pFlutter,
   rate:Math.max(.72,Math.min(1.48,1+.65*collective)),

 async function toggleFlightAudio(){
  if(audioPending)return;
  if(audioOn){
   audioOn=false;
   showAudioStatus('소리 꺼짐');
   updateAudio();
   return;
  }
  audioPending=true;
  try{
   if(!audio||audio.ac.state==='closed')audio=makeAudio();
   const current=audio;
   await current.ac.resume();
   if(audio!==current)return;
   if(current.ac.state!=='running')throw Error('AudioContext is not running');
   audioOn=true;
   updateAudio();
   showAudioStatus('모터음 활성 · 실제 계산 모터 출력 연동 / 배속과 음높이 분리');
  }catch(e){
   audioOn=false;
   stopFlightAudio();
   showAudioStatus('소리를 시작할 수 없습니다. 버튼을 다시 눌러 주세요.');
  }finally{
   audioPending=false;
  }
 }

    closeTooltip(false);
    lastPointerWasTouch = false;

  };

(() =&gt; {
  const selector = '.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]';
  const disabled = ':disabled,[aria-disabled=&quot;true&quot;]';
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]')) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role=&quot;tablist&quot;]')) {
    const selected =
      list.querySelector('[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]') ??
      list.querySelector('[role=&quot;tab&quot;].active') ??
      list.querySelector('[role=&quot;tab&quot;]');

      selectTab(selected);
    }

    document.removeEventListener(&quot;click&quot;, interact);

  }, { once: true });

      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-next cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;`;
      const previous = controls.querySelector(&quot;.viz-carousel-previous&quot;);
      const next = controls.querySelector(&quot;.viz-carousel-next&quot;);
      const picker = controls.querySelector(&quot;.viz-carousel-picker&quot;);
      const summary = picker.querySelector(&quot;summary&quot;);
      const count = controls.querySelector(&quot;.viz-carousel-count&quot;);
      const name = controls.querySelector(&quot;.viz-carousel-name&quot;);
      const options = controls.querySelector(&quot;.viz-carousel-options&quot;);
      const status = document.createElement(&quot;span&quot;);
      status.className = &quot;sr-only&quot;;
      status.setAttribute(&quot;role&quot;, &quot;status&quot;);
      status.setAttribute(&quot;aria-live&quot;, &quot;polite&quot;);
      status.setAttribute(&quot;aria-atomic&quot;, &quot;true&quot;);
      previous.setAttribute(
        &quot;aria-label&quot;,
        root.dataset.previousLabel ?? &quot;Previous variant&quot;,
      );
      next.setAttribute(&quot;aria-label&quot;, root.dataset.nextLabel ?? &quot;Next variant&quot;);

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        summaryPointerHandled =
          event.pointerType === &quot;mouse&quot; &amp;&amp; event.button === 0 &amp;&amp; !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener(&quot;click&quot;, (event) =&gt; {
        if (summaryPointerHandled &amp;&amp; event.detail &gt; 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) =&gt; {
        const choice = document.createElement(&quot;button&quot;);
        choice.type = &quot;button&quot;;
        choice.className = &quot;cursor-interaction&quot;;
        choice.textContent = panel.dataset.variant;
        choice.addEventListener(&quot;click&quot;, () =&gt; {
          select(index);
          summary.focus();
        });
        choice.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
          if (
            picker.open &amp;&amp;
            event.pointerType === &quot;mouse&quot; &amp;&amp;
            event.button === 0 &amp;&amp;
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) =&gt; {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) =&gt; {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            &quot;aria-current&quot;,
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener(&quot;click&quot;, () =&gt;
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener(&quot;click&quot;, () =&gt;
        select((active + 1) % panels.length),
      );
      picker.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Escape&quot; &amp;&amp; picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === &quot;ArrowDown&quot;) {
          nextIndex = index &lt; 0 ? active : (index + 1) % choices.length;
        } else if (event.key === &quot;ArrowUp&quot;) {
          nextIndex = index &lt; 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open &amp;&amp; event.key === &quot;Home&quot;) {
          nextIndex = 0;
        } else if (picker.open &amp;&amp; event.key === &quot;End&quot;) {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener(&quot;focusout&quot;, (event) =&gt; {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) =&gt; {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () =&gt; {
        mousePointerId = null;
      };
      const sizePicker = () =&gt; {
        root.style.setProperty(
          &quot;--viz-carousel-picker-height&quot;,
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener(&quot;toggle&quot;, sizePicker);
      window.addEventListener(&quot;resize&quot;, sizePicker);
      document.addEventListener(&quot;pointerdown&quot;, dismiss);
      document.addEventListener(&quot;pointerup&quot;, endPointerSelection);
      document.addEventListener(&quot;pointercancel&quot;, endPointerSelection);
      window.addEventListener(&quot;blur&quot;, endPointerSelection);
      window.addEventListener(
        &quot;pagehide&quot;,
        () =&gt; {
          document.removeEventListener(&quot;pointerdown&quot;, dismiss);
          document.removeEventListener(&quot;pointerup&quot;, endPointerSelection);
          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
&lt;/script&gt;
