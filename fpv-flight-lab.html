 &lt;div class=&quot;views&quot;&gt;&lt;section&gt;&lt;h3&gt;A · 추적 카메라&lt;/h3&gt;&lt;canvas id=&quot;droneA&quot; role=&quot;img&quot; aria-label=&quot;가상 비행장에서 이동하며 기동하는 드론의 외부 시점&quot;&gt;&lt;/canvas&gt;&lt;div id=&quot;angleA&quot; class=&quot;tabular-nums&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;B · FPV 카메라&lt;/h3&gt;&lt;canvas id=&quot;droneB&quot; role=&quot;img&quot; aria-label=&quot;비행 위치와 기체 자세를 함께 반영하는 FPV 카메라&quot;&gt;&lt;/canvas&gt;&lt;div id=&quot;angleB&quot; class=&quot;tabular-nums&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
 &lt;div class=&quot;text-small text-muted&quot;&gt;B는 실사 영상이 아닌 가상 비행장입니다. 중앙 십자선은 카메라에 고정되고 풍경만 움직입니다.&lt;/div&gt;
 &lt;h3&gt;저주파 반동 · A 실선 / B 점선&lt;/h3&gt;
 &lt;div class=&quot;text-small text-muted&quot;&gt;그래프는 기동 후 주 회전 방향의 반동입니다. 비행 화면에는 이동·선회와 여러 방향의 흔들림이 함께 반영됩니다.&lt;/div&gt;
 &lt;label class=&quot;form-label&quot;&gt;그래프 보기&lt;select class=&quot;form-select&quot; id=&quot;graph&quot;&gt;&lt;option value=&quot;angle&quot;&gt;전체 기동 · 누적 회전각&lt;/option&gt;&lt;option value=&quot;residual&quot;&gt;중앙 복귀 직후 · 잔진동 확대&lt;/option&gt;&lt;option value=&quot;rate&quot;&gt;지정 / 표시 각속도&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;canvas id=&quot;trace&quot; role=&quot;img&quot; aria-label=&quot;A 실선은 기체 회전각, B 점선은 반대 방향의 풍경 회전각. 가로축 시간 초, 세로축 각도 도.&quot;&gt;&lt;/canvas&gt;
 &lt;div class=&quot;text-small text-muted&quot;&gt;A = 기체 회전각, B = 카메라 기준 풍경 회전각(−A). 같은 운동의 두 시점이며 PID 성능 차이가 아닙니다.&lt;/div&gt;
 &lt;label class=&quot;form-label&quot;&gt;시간 탐색&lt;input id=&quot;scrub&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
 &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm tabular-nums&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;중앙 복귀 후 5초 측정&lt;/th&gt;&lt;th&gt;A · 기체 실선&lt;/th&gt;&lt;th&gt;B · 풍경 점선&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;metrics&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;div class=&quot;text-small&quot; id=&quot;heat&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;모델 및 측정 기준&lt;/summary&gt;&lt;div class=&quot;text-small&quot;&gt;회전 구간은 PID와 무관하게 지정 각속도로 정확히 360°를 재생합니다. 중앙 도착 순간의 각도는 정확히 360°이며, 이후 5초는 중앙을 목표로 하는 교육용 PID 회복 모델입니다. 정지 충격을 잔류 각속도로 가정하고 P는 복원, I는 누적 오차 보정, D는 감쇠에 적용합니다. 실제 Acro 제어기의 실측 재현이나 자동 수평 복귀 동작이 아닙니다. P=0 등에서는 복원이 되지 않을 수 있습니다. 스로틀 0%에서도 비교를 위해 지정 회전은 재생하지만 회복 제어는 꺼집니다. 비행 경로는 미리 정한 교육용 경로이며 공력 기반 자유비행 계산은 아닙니다. 프로프워시는 하강·급선회·기동 회복 시의 불규칙한 자세 외란으로, D 잡음 진동은 합성 미세 진동으로 표현합니다. 음향은 이 상태에 연동한 합성음이며 실제 녹음이나 해당 영상의 추출음이 아닙니다. 부품 사양은 임의 출력·관성·지연 계수에 반영합니다. 용량은 공칭 에너지 계산에만 사용합니다. 기본 건조중량 400g과 반응 계수는 실측값이 아닙니다. 주파수는 복귀 후 평균각 상승 교차 간격 기반 추정이며, D 부하는 온도나 안전 판정이 아닙니다.&lt;/div&gt;&lt;/details&gt;
