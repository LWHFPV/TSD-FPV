
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>TSD FPV Flight Test</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0;
      background:#081321;
      color:#e9f3ff;
      font-family:Arial,sans-serif;
    }
    header {
      padding:15px;
      background:#14283d;
      font-weight:bold;
    }
    main { padding:12px; }
    canvas {
      width:100%;
      display:block;
      background:#14263a;
      border-radius:12px;
    }
    .panel {
      margin-top:12px;
      padding:15px;
      background:#172b40;
      border-radius:12px;
    }
    label {
      display:block;
      margin:12px 0;
    }
    input { width:100%; }
    button {
      padding:12px;
      margin:4px;
      border:0;
      border-radius:8px;
      background:#37b8ef;
      font-weight:bold;
    }
    #status { color:#91cfff; }
  </style>
</head>
<body>
  <header>TSD Aero Systems · FPV TEST</header>
  <main>
    <canvas id="fpv" width="960" height="540">
    </canvas>

    <section class="panel">
      <strong>비행 기준 설정</strong>
      <p>카메라 상향각: 35°</p>
      <p>수평 호버 기준: 37%</p>
      <p>전진 목표 피치: -35°</p>
      <p id="status">엔진 연결 대기</p>
    </section>

    <section class="panel">
      <button id="hover">호버</button>
      <button id="forward">전진</button>
      <button id="splitL">스플릿 S 좌</button>
      <button id="splitR">스플릿 S 우</button>
      <button id="reset">초기화</button>
    </section>

    <section class="panel">
      <strong>PID 설정</strong>
      <label>P <output id="pv">47</output>
        <input id="p" type="range"
               min="0" max="150" value="47">
      </label>
      <label>I <output id="iv">84</output>
        <input id="i" type="range"
               min="0" max="150" value="84">
      </label>
      <label>D <output id="dv">34</output>
        <input id="d" type="range"
               min="0" max="150" value="34">
      </label>
    </section>
  </main>

  <script src="tsd-flight-engine.js"></script>
  <script src="tsd-fpv-camera.js"></script>
</body>
</html>
