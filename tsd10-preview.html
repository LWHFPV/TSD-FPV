<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSD10 · 3D 설계 미리보기</title><style>html,body{margin:0;width:100%;height:100%;font:15px/1.5 system-ui,"Malgun Gothic",sans-serif;background:#eef3fa;color:#192d4c}body{display:flex;flex-direction:column}#tsdPreviewHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;background:#10243d;color:white}#tsdPreviewHeader a{color:#b9dcff;font-size:13px}#tsdPreviewHeader small{color:#bfd0e7}iframe{display:block;width:100%;flex:1;min-height:0;border:0}iframe[hidden]{display:none}#loading,#error{padding:35px;text-align:center}#error{color:#a33416}</style></head><body><header id="tsdPreviewHeader"><strong>TSD10 · 3D 부품별 미리보기</strong><small>기존 3D 뷰어 유지 · TSD07 설계 검증 후 추가</small><a href="./drone-design.html" target="_blank" rel="noopener">기존 공개 3D 화면 열기</a></header><p id="loading">TSD10 기존 3D 모델과 카테고리 화면을 불러오는 중입니다.</p><p id="error" hidden></p><iframe id="preview" title="TSD10 기존 3D 뷰어 기반 카테고리별 미리보기" hidden></iframe><script>(async function(){
 const error = document.getElementById("error");
 try {
  const response=await fetch("./drone-design.html",{cache:"no-store"});
  if(!response.ok)throw Error("원본 3D 페이지를 불러올 수 없습니다 (HTTP "+response.status+")");
  let source=(await response.text()).replace(/\r\n/g,"\n");
  const edits=[["<title>FPV 프레임 · 10인치 Rev W 후방브래킷 수정검토 | TSD Aero Systems</title>","<title>TSD10 · 3D 카테고리 미리보기 | TSD Aero Systems</title>"],["<h1 id=\"viewer-title\">10인치 True X 전체 조립</h1>","<div class=\"tsd-model-switch\"><h1 id=\"viewer-title\">TSD10</h1><span class=\"tsd-soon\" aria-label=\"TSD07 설계 완료 후 제공\">TSD07 <small>준비 중</small></span></div>"],["</style>",".tsd-model-switch{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}\n.tsd-model-switch h1{font-size:clamp(20px,3.15vw,30.8px)!important;padding:7px 16px;border:1px solid #92b4ed;border-radius:9px;background:#ffffff17}\n.tsd-model-switch .tsd-soon{font-size:clamp(16px,2.4vw,23px);padding:7px 16px;border:1px solid #8298bd;border-radius:9px;color:#bfcce2;opacity:.7}\n.tsd-model-switch .tsd-soon small{font-size:10px;vertical-align:middle}\n.tsd-cat-title{margin:8px 0 6px;font-size:12px;font-weight:750;color:#536785}\n#tsdCategoryBar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:0 0 9px}\n#tsdCategoryBar button{min-height:29px;padding:5px 5px;font-size:11px;line-height:1.25;white-space:normal;text-align:center;overflow-wrap:anywhere}\n#tsdCategoryBar button[aria-pressed=true]{background:#1553ce;color:#fff}\n#tsdCategoryBar button:first-child{grid-column:1/-1}\n@media(max-width:900px){#tsdCategoryBar{grid-template-columns:repeat(auto-fit,minmax(108px,1fr))}#tsdCategoryBar button:first-child{grid-column:auto}}\n@media(max-width:420px){#tsdCategoryBar{grid-template-columns:repeat(2,minmax(0,1fr))}}\n</style>"],["<input id=\"query\" type=\"search\" placeholder=\"부품 이름 검색\" aria-label=\"부품 이름 검색\">","<input id=\"query\" type=\"search\" placeholder=\"부품 이름 검색\" aria-label=\"부품 이름 검색\">\n<div class=\"tsd-cat-title\" id=\"tsd-cat-label\">부품 카테고리</div><div id=\"tsdCategoryBar\" role=\"group\" aria-labelledby=\"tsd-cat-label\"><button type=\"button\" data-tsd-category=\"all\" aria-pressed=\"true\">전체 조립</button><button type=\"button\" data-tsd-category=\"frame\" aria-pressed=\"false\">프레임</button><button type=\"button\" data-tsd-category=\"rear\" aria-pressed=\"false\">후방</button><button type=\"button\" data-tsd-category=\"gps\" aria-pressed=\"false\">GPS</button><button type=\"button\" data-tsd-category=\"camera\" aria-pressed=\"false\">카메라</button><button type=\"button\" data-tsd-category=\"electronics\" aria-pressed=\"false\">전자부</button><button type=\"button\" data-tsd-category=\"wiring\" aria-pressed=\"false\">전장 배치</button><button type=\"button\" data-tsd-category=\"battery\" aria-pressed=\"false\">배터리</button><button type=\"button\" data-tsd-category=\"power\" aria-pressed=\"false\">전원</button><button type=\"button\" data-tsd-category=\"propulsion\" aria-pressed=\"false\">모터·프롭·체결부</button><button type=\"button\" data-tsd-category=\"propfastener\" aria-pressed=\"false\">프롭 나사부</button></div>"],["const partRows=new Map();","const partRows=new Map();\n/* 카테고리 필터만 추가: 기존 3D 모델, 뷰어 조작, 옵션은 그대로 유지 */\nlet tsdCategory=\"all\";\nfunction tsdCategoryOf(key,oldGroup,displayName){\n const x=(key+\" \"+oldGroup+\" \"+displayName).toLowerCase();\n if(/m5[_ -]?(locknut|washer)|prop[_ -]?(nut|washer)|locknut|propeller[_ -]?(nut|washer)|프롭.{0,8}(너트|나사|와셔)|프로펠러.{0,8}(너트|나사|와셔)/.test(x))return \"propfastener\";\n if(/gps|gnss|위성/.test(x))return \"gps\";\n if(/camera|cam_|o4pro|lens|pivot|카메라|렌즈/.test(x))return \"camera\";\n if(/v3115|hq1050|motor|prop|모터|프로펠러|프롭|체결부|drive/.test(x))return \"propulsion\";\n if(/wire|cable|harness|전장.?배치|배선/.test(x))return \"wiring\";\n if(/xt60|xt90|power|pdb|socket|전원|커넥터/.test(x))return \"power\";\n if(/battery|skid|strap|배터리|스트랩/.test(x))return \"battery\";\n if(/rear|antenna|rf|후방|안테나|sma/.test(x))return \"rear\";\n if(/vtx|esc|fc_|flight.?controller|cuav|전자부|전자/.test(x))return \"electronics\";\n return \"frame\";\n}\nfor(const chip of document.querySelectorAll(\"#tsdCategoryBar button\")){\n chip.addEventListener(\"click\",()=>{\n  tsdCategory=chip.dataset.tsdCategory;\n  /* 카테고리 전환 시 오래된 검색어가 부품을 숨기지 않도록 초기화 */\n  const searchBox=document.getElementById(\"query\");\n  if(searchBox){searchBox.value=\"\";searchBox.dispatchEvent(new Event(\"input\",{bubbles:true}));}\n  document.body.dataset.tsdCategory=tsdCategory;\n  chosen=null;only=false;list.scrollTop=0;visibleListSignature=\"\";\n  for(const b of document.querySelectorAll(\"#tsdCategoryBar button\"))b.setAttribute(\"aria-pressed\",String(b===chip));\n  updatePanel();schedule();\n });\n}"],["return active().filter(k=>!hidden.has(k)&&!(view===\"vtx\"&&(drivetrainKeys.has(k)||hideVtx.some(x=>k.startsWith(x)))));","return active().filter(k=>(tsdCategory===\"all\"||tsdCategoryOf(k,group(k),title(k))===tsdCategory)&&!hidden.has(k)&&!(view===\"vtx\"&&(drivetrainKeys.has(k)||hideVtx.some(x=>k.startsWith(x)))));"],["  const category=group(k), name=title(k);\n  if(query&&!(name+\" \"+k).toLowerCase().includes(query))continue;","  const category=group(k), name=title(k);\n  if(tsdCategory!==\"all\"&&tsdCategoryOf(k,category,name)!==tsdCategory)continue;\n  if(query&&!(name+\" \"+k).toLowerCase().includes(query))continue;"],["message.textContent=\"검색 결과가 없습니다.\";","message.textContent=tsdCategory===\"all\"?\"검색 결과가 없습니다.\":\"이 카테고리에 표시할 부품이 없습니다.\";"]];
  for(const [from,to] of edits){
   const at=source.indexOf(from);
   if(at<0||source.indexOf(from,at+from.length)>=0)throw Error("원본 소스가 변경되어 안전한 미리보기 패치를 중단했습니다: "+from.slice(0,60));
   source=source.replace(from,to);
  }
  if(!source.includes('<canvas id="view"')||!source.includes('<script id="geometry"'))throw Error("3D 캔버스 또는 지오메트리 데이터를 찾을 수 없습니다");
  const iframe=document.getElementById("preview");
  iframe.addEventListener("load",()=>{document.getElementById("loading").hidden=true;iframe.hidden=false;},{once:true});
  iframe.srcdoc=source;
 }catch(e){document.getElementById("loading").hidden=true;error.hidden=false;error.textContent="3D 미리보기 오류: "+e.message;console.error(e);}
})();</script></body></html>
