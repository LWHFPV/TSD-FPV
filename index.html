
<script>
/*
 * TSD 모바일/PC 통합 잠금 관리
 * PC: 기존 Cloudflare 팝업 인증 유지
 * 모바일: 동일 탭 인증 및 원래 홈페이지 복귀
 */
(function () {
  'use strict';

  const site = document.getElementById('tsd-fpv-preview');
  const title = document.getElementById('tsd-unlock-title');

  if (!site || !title) return;

  const privateOrigin =
    'https://tsd-fpv-private.flydragon103.workers.dev';

  const unlockKey = 'tsd-home-unlocked-v1';
  const mobilePendingKey = 'tsd-mobile-pending-v1';

  const lockedAreas = site.querySelectorAll(
    'header, main, footer, .skip-link'
  );

  let locked = true;
  let clicks = 0;
  let firstClickAt = 0;
  let lastTouchAt = -Infinity;
  let popup = null;
  let pendingNonce = '';

  function hasSessionUnlock() {
    try {
      return sessionStorage.getItem(unlockKey) === '1';
    } catch (_) {
      return false;
    }
  }

  function rememberUnlock() {
    try {
      sessionStorage.setItem(unlockKey, '1');
    } catch (_) {}
  }

  function setLocked(value) {
    locked = value;

    document.documentElement.dataset.tsdHomeState =
      value ? 'locked' : 'unlocked';

    lockedAreas.forEach(function (area) {
      area.inert = value;
    });

    if (value) {
      title.setAttribute('role', 'button');
      title.setAttribute('tabindex', '0');
    } else {
      title.removeAttribute('role');
      title.removeAttribute('tabindex');
      title.blur();
    }
  }

  // 모바일 인증 후 돌아온 상태를 확인
  function consumeMobileReturn() {
    if (!location.hash.startsWith('#tsd_mobile_auth=')) {
      return;
    }

    const params = new URLSearchParams(
      location.hash.substring(1)
    );

    const returnedNonce = params.get('tsd_mobile_auth');

    let pending = null;

    try {
      pending = JSON.parse(
        sessionStorage.getItem(mobilePendingKey) || 'null'
      );
      sessionStorage.removeItem(mobilePendingKey);
    } catch (_) {}

    if (
      returnedNonce &&
      pending &&
      pending.nonce === returnedNonce &&
      Number.isFinite(pending.createdAt) &&
      Date.now() - pending.createdAt >= 0 &&
      Date.now() - pending.createdAt <= 15 * 60 * 1000
    ) {
      rememberUnlock();
    }

    // 인증 복귀용 해시를 주소창에서 제거
    history.replaceState(
      null,
      '',
      location.pathname + location.search
    );
  }

  function startAuthentication() {
    pendingNonce = crypto.randomUUID();

    const auth = new URL(privateOrigin + '/unlock');

    auth.searchParams.set('from', location.origin);
    auth.searchParams.set('nonce', pendingNonce);

    const isMobile =
      window.matchMedia('(pointer: coarse)').matches;

    if (isMobile) {
      // 모바일은 팝업 대신 현재 탭에서 인증
      try {
        sessionStorage.setItem(
          mobilePendingKey,
          JSON.stringify({
            nonce: pendingNonce,
            createdAt: Date.now()
          })
        );
      } catch (_) {
        alert(
          '브라우저에서 인증 상태를 저장할 수 없습니다. ' +
          'Safari 또는 Chrome에서 다시 시도하세요.'
        );
        return;
      }

      auth.searchParams.set('mobile', '1');
      auth.searchParams.set(
        'return_to',
        location.origin + location.pathname
      );

      location.assign(auth.href);
      return;
    }

    // PC는 기존 인증 팝업 사용
    popup = window.open(
      auth.href,
      'tsdAccessLogin',
      'width=560,height=720,resizable=yes,scrollbars=yes'
    );

    if (!popup) {
      pendingNonce = '';
      alert('인증 팝업이 차단되었습니다.');
    }
  }

  function countClick() {
    if (!locked) return;

    const now = performance.now();

    if (
      clicks === 0 ||
      now - firstClickAt > 3000
    ) {
      clicks = 0;
      firstClickAt = now;
    }

    clicks++;

    if (clicks >= 5) {
      clicks = 0;
      firstClickAt = 0;
      startAuthentication();
    }
  }

  // 모바일 터치는 pointerup으로 인식
  title.addEventListener(
    'pointerup',
    function (event) {
      if (
        event.pointerType === 'touch' ||
        event.pointerType === 'pen'
      ) {
        lastTouchAt = performance.now();
        countClick();
      }
    },
    { passive: true }
  );

  // PC 마우스 클릭 및 구형 모바일 click 대체
  title.addEventListener('click', function () {
    // 터치 이후 발생하는 중복 click 무시
    if (
      performance.now() - lastTouchAt < 800
    ) {
      return;
    }

    countClick();
  });

  title.addEventListener('keydown', function (event) {
    if (
      event.key === 'Enter' ||
      event.key === ' '
    ) {
      event.preventDefault();
      countClick();
    }
  });

  // PC 팝업 인증 성공 처리
  window.addEventListener('message', function (event) {
    if (
      !locked ||
      !pendingNonce ||
      event.origin !== privateOrigin ||
      event.source !== popup ||
      !event.data ||
      event.data.type !== 'TSD_ACCESS_AUTH_OK_V1' ||
      event.data.nonce !== pendingNonce
    ) {
      return;
    }

    pendingNonce = '';
    popup = null;

    rememberUnlock();
    setLocked(false);
  });

  // 모바일 인증 복귀 및 뒤로가기 처리
  window.addEventListener('pageshow', function (event) {
    consumeMobileReturn();

    if (event.persisted) {
      clicks = 0;
      firstClickAt = 0;
      pendingNonce = '';
      popup = null;
    }

    setLocked(!hasSessionUnlock());
  });

  consumeMobileReturn();
  setLocked(!hasSessionUnlock());

})();
</script>
